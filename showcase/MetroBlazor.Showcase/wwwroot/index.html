<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetroBlazor Showcase</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#1b1b1b" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MetroBlazor.Showcase.styles.css" />
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // https://github.com/rafrex/spa-github-pages
        // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
        (function (l) {
            if (l.search) {
                var q = {};
                l.search.slice(1).split('&').forEach(function (v) {
                    var a = v.split('=');
                    q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
                });
                if (q.p !== undefined) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, -1) + (q.p || '') +
                        (q.q ? ('?' + q.q) : '') +
                        l.hash
                    );
                }
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
</head>

<body>
    <div id="app">
        <div class="loading-shell">
            <div class="loading-brand">
                <img class="loading-logo" src="metroblazor-icon.svg" alt="" aria-hidden="true" />
                <span class="loading-logo-text">MetroBlazor</span>
            </div>
            <div class="loading-progress-metro" role="progressbar" aria-label="Loading">
                <span class="loading-progress-dot" style="--metro-loading-delay: 0ms;"></span>
                <span class="loading-progress-dot" style="--metro-loading-delay: 90ms;"></span>
                <span class="loading-progress-dot" style="--metro-loading-delay: 180ms;"></span>
                <span class="loading-progress-dot" style="--metro-loading-delay: 270ms;"></span>
                <span class="loading-progress-dot" style="--metro-loading-delay: 360ms;"></span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
